<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>treegen viewer</title>
<style>
  :root { --bg:#14161a; --panel:#1c2026; --line:#2c323b; --fg:#d8dde5; --dim:#8b95a3; --accent:#8fbf6a; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; background:var(--bg); color:var(--fg);
         font:12px/1.45 ui-sans-serif, system-ui, "Segoe UI", sans-serif; overflow:hidden; }
  #view { flex:1; min-width:0; position:relative; overflow:hidden; }   /* else the canvas's old width blocks shrinking */
  #canvas { width:100%; height:100%; display:block; }
  #hud { position:absolute; top:10px; left:12px; color:var(--dim); font-size:11px; white-space:pre; pointer-events:none;
         text-shadow:0 1px 2px #000; }
  #busy { position:absolute; top:10px; right:12px; color:var(--accent); font-size:11px; display:none; }
  #panel { width:340px; flex:0 0 auto; background:var(--panel); overflow-y:auto; overflow-x:hidden; padding:10px 12px 40px; }
  #splitter { flex:0 0 5px; cursor:col-resize; background:var(--line); }
  #splitter:hover, #splitter.dragging { background:var(--accent); }
  h1 { font-size:13px; margin:2px 0 10px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  /* fieldsets default to min-width:min-content, which pushed the panel into a horizontal scroll */
  fieldset { border:1px solid var(--line); border-radius:4px; margin:0 0 10px; padding:6px 8px 8px; min-width:0; }
  legend { color:var(--dim); text-transform:uppercase; letter-spacing:.06em; font-size:10px; padding:0 4px; cursor:pointer; }
  .row { display:flex; align-items:center; gap:6px; margin:3px 0; }
  .row label { flex:0 1 120px; min-width:0; color:var(--fg); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row input[type=range] { flex:1; min-width:0; accent-color:var(--accent); }
  .row input[type=number], .row input[type=text], .row select {
      width:72px; background:#11141a; color:var(--fg); border:1px solid var(--line); border-radius:3px; padding:2px 4px; }
  .row input[type=number] { flex:0 0 auto; }
  .row .wide, .row .grow { flex:1 1 0; min-width:0; width:auto; }
  .row input[type=text].wide { font-family:ui-monospace, monospace; font-size:11px; }
  button { background:#262c35; color:var(--fg); border:1px solid var(--line); border-radius:3px;
           padding:5px 8px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#10130f; border-color:var(--accent); font-weight:600; }
  .buttons { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .msg { color:var(--dim); margin-top:6px; word-break:break-all; }
  .msg.err { color:#e0714f; }
  .collapsed .body { display:none; }
  [hidden] { display:none !important; }
  #variantsOverlay { position:absolute; inset:0; background:rgba(20,22,26,.94); display:flex; flex-direction:column;
                     padding:14px 16px 16px; gap:10px; }
  .vhead { display:flex; align-items:center; gap:10px; color:var(--dim); }
  .vhead span { flex:1; }
  #variants { flex:1; min-height:0; display:grid; grid-template-columns:repeat(3, minmax(0,1fr));
              grid-template-rows:repeat(3, minmax(0,1fr)); gap:8px; }
  #variants .cell { display:flex; flex-direction:column; min-height:0; border:1px solid var(--line); border-radius:4px;
                    background:#fff; overflow:hidden; }
  #variants .cell.ready { cursor:pointer; }
  #variants .cell.ready:hover { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  #variants .cell.current { border-color:var(--accent); }
  #variants .cell.pending { background:transparent; border-style:dashed; justify-content:flex-end; }
  #variants img { flex:1; min-height:0; width:100%; object-fit:contain; }
  #variants .cap { flex:0 0 auto; padding:2px 6px; background:var(--panel); color:var(--fg); font-size:11px; }
  .dot { flex:0 0 7px; width:7px; height:7px; border-radius:50%; margin-right:2px; display:inline-block; }
  legend .dot { margin:0 6px 1px 0; vertical-align:middle; }
  .t1 { background:#6fc98a; } .t2 { background:#e0b558; } .t3 { background:#d2563a; }
  #tierhelp { color:var(--dim); margin:-4px 0 8px; font-size:10px; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view">
  <canvas id="canvas"></canvas>
  <div id="hud"></div>
  <div id="busy">generating…</div>
  <div id="variantsOverlay" hidden>
    <div class="vhead"><span id="vtitle"></span><button id="vclose">close (Esc)</button></div>
    <div id="variants"></div>
  </div>
</div>
<div id="splitter" title="drag to resize the panel"></div>
<div id="panel">
  <h1>treegen <span id="version"></span></h1>

  <fieldset><legend>tree</legend><div class="body">
    <div class="row"><label>species</label><select id="species" class="wide"></select></div>
    <div class="row"><label>scene</label><select id="scene" class="wide"></select></div>
    <div class="row"><label>seed</label><input type="range" id="seedR" min="1" max="200" step="1" value="42">
      <input type="number" id="seedN" value="42"></div>
    <div class="row"><label>age (years)</label><input type="range" id="ageR" min="1" max="200" step="1" value="80">
      <input type="number" id="ageN" value="80"></div>
    <div class="row"><label>exact on release</label><input type="checkbox" id="exact" checked>
      <span class="msg grow" id="scrubNote">drag = fast approximation</span></div>
    <div class="row"><label>geometry lod</label><input type="range" id="lodR" min="0.25" max="2" step="0.05" value="1">
      <input type="number" id="lodN" value="1" step="0.05"></div>
    <div class="buttons">
      <button class="primary" id="regen">regenerate (exact)</button>
      <button id="export">export USD</button>
      <button id="save">save species…</button>
      <button id="variantsBtn">variant grid</button>
    </div>
    <div class="msg" id="msg"></div>
  </div></fieldset>

  <fieldset><legend>display</legend><div class="body">
    <div class="row"><label>colour</label><select id="mode" class="wide">
      <option value="bark">bark / order</option>
      <option value="light">light exposure</option>
      <option value="age">birth age</option>
      <option value="order">branch order</option>
      <option value="mass">downstream radius</option>
    </select></div>
    <div class="row"><label>meshes</label><input type="checkbox" id="showMesh" checked>
      <label>twigs</label><input type="checkbox" id="showTwig" checked></div>
    <div class="row"><label>skeleton</label><input type="checkbox" id="showSkel">
      <label>shed limbs</label><input type="checkbox" id="showShed"></div>
    <div class="row"><label>ground grid</label><input type="checkbox" id="showGrid" checked></div>
    <div class="row"><label>attractors</label><input type="checkbox" id="showAttr">
      <label>envelope</label><input type="checkbox" id="showEnv"></div>
    <div class="msg">attractors: grey = never reached, green = active, blue = consumed, red = shaded out</div>
  </div></fieldset>

  <div id="tierhelp"><span class="dot t1"></span> instant (geometry) &nbsp; <span class="dot t2"></span> fast (skeleton)
    &nbsp; <span class="dot t3"></span> full simulation</div>
  <div id="params"></div>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = (id) => document.getElementById(id);
const msg = (t, err = false) => { const m = $("msg"); m.textContent = t; m.className = "msg" + (err ? " err" : ""); };

// ---------------------------------------------------------------- three.js setup
const renderer = new THREE.WebGLRenderer({ canvas: $("canvas"), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 2000);
camera.position.set(28, 14, 28);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 9, 0);
scene.add(new THREE.HemisphereLight(0xbcd3ff, 0x30281e, 2.1));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.0); sun.position.set(12, 26, 10); scene.add(sun);
const grid = new THREE.GridHelper(80, 40, 0x39414c, 0x232931); scene.add(grid);

// panel width: drag the splitter; remembered per browser
const PANEL_KEY = "treegen.panelWidth";
function setPanelWidth(w) {
  w = Math.round(Math.min(Math.max(w, 260), Math.max(260, innerWidth - 320)));
  $("panel").style.width = w + "px";
  resize();
  return w;
}
try { const w = +localStorage.getItem(PANEL_KEY); if (w) $("panel").style.width = w + "px"; } catch (e) {}
$("splitter").onpointerdown = (ev) => {
  const sp = $("splitter"); sp.setPointerCapture(ev.pointerId); sp.classList.add("dragging");
  const x0 = ev.clientX, w0 = $("panel").offsetWidth;
  let w = w0;
  sp.onpointermove = (e) => { w = setPanelWidth(w0 + (x0 - e.clientX)); };
  sp.onpointerup = () => {
    sp.onpointermove = sp.onpointerup = null; sp.classList.remove("dragging");
    try { localStorage.setItem(PANEL_KEY, String(w)); } catch (e) {}
  };
};

function resize() {
  const v = $("view");
  renderer.setSize(v.clientWidth, v.clientHeight, false);
  camera.aspect = v.clientWidth / v.clientHeight;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();

// ---------------------------------------------------------------- state
let schema = null, params = null, data = null;
let objects = { mesh: null, twigs: null, skel: null, shed: null, attr: null, env: null };
let inflight = null, busyCount = 0, tiers = {};
function busy(delta) {
  busyCount = Math.max(0, busyCount + delta);
  $("busy").style.display = busyCount ? "block" : "none";
}

function disposeAll() {
  for (const k in objects) {
    const o = objects[k];
    if (o) { scene.remove(o); o.geometry.dispose(); o.material.dispose(); objects[k] = null; }
  }
}

// ---------------------------------------------------------------- payload parsing
function unpack(buf) {
  const dv = new DataView(buf);
  const metaLen = dv.getUint32(0, true);
  const meta = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, metaLen)));
  let off = 4 + metaLen;
  const arr = {};
  for (const a of meta.arrays) {
    const bytes = a.length * 4;
    arr[a.name] = a.type === "u32" ? new Uint32Array(buf.slice(off, off + bytes))
                                   : new Float32Array(buf.slice(off, off + bytes));
    off += bytes;
  }
  return { meta, arr };
}

// ---------------------------------------------------------------- colour ramps
function ramp(t) {   // dark -> ember -> bright, similar to inferno
  t = Math.min(Math.max(t, 0), 1);
  return [Math.min(1, 0.15 + 1.9 * t * t), Math.max(0, 1.25 * t * t * t - 0.05), Math.max(0, 0.45 * (1 - t) + 0.6 * t * t * t * t)];
}
const ORDER_COLORS = [[0.36, 0.26, 0.18], [0.45, 0.36, 0.22], [0.42, 0.52, 0.28], [0.35, 0.58, 0.45], [0.4, 0.45, 0.7], [0.55, 0.4, 0.6]];

function colorsFor(prefix, mode, meta) {
  const a = data.arr, n = a[prefix + "_pos"].length / 3;
  const out = new Float32Array(n * 3);
  const ex = a[prefix + "_exposure"], ord = a[prefix + "_order"], birth = a[prefix + "_birth"];
  const rad = a[prefix + "_radius"], dead = a[prefix + "_dead"];
  const maxR = rad ? rad.reduce((m, v) => Math.max(m, v), 1e-6) : 1;
  for (let i = 0; i < n; i++) {
    let c;
    if (mode === "light") c = ramp(ex ? ex[i] : 0);
    else if (mode === "age") c = ramp(birth ? 1 - birth[i] / Math.max(meta.age, 1) : 0);
    else if (mode === "order" || mode === "bark") {
      c = ORDER_COLORS[Math.min(ord ? ord[i] : 0, ORDER_COLORS.length - 1)].slice();
      if (mode === "bark") { c = [0.30 - 0.02 * (ord ? ord[i] : 0), 0.24, 0.17]; }
    } else if (mode === "mass") c = ramp(rad ? Math.pow(rad[i] / maxR, 0.4) : 0);
    else c = [0.3, 0.24, 0.17];
    if (dead && dead[i] > 0.5) c = [0.55, 0.52, 0.47];
    out[i * 3] = c[0]; out[i * 3 + 1] = c[1]; out[i * 3 + 2] = c[2];
  }
  return out;
}

// ---------------------------------------------------------------- scene build
function rebuild() {
  if (!data) return;
  disposeAll();
  const { arr, meta } = data;
  const mode = $("mode").value;

  if (arr.mesh_pos.length && $("showMesh").checked) {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(arr.mesh_pos, 3));
    g.setAttribute("color", new THREE.BufferAttribute(colorsFor("mesh", mode, meta), 3));
    g.setIndex(new THREE.BufferAttribute(arr.mesh_idx, 1));
    g.computeVertexNormals();
    const m = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0.0, flatShading: false });
    objects.mesh = new THREE.Mesh(g, m); scene.add(objects.mesh);
  }
  if (arr.twig_pos.length && $("showTwig").checked) {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(arr.twig_pos, 3));
    g.setAttribute("color", new THREE.BufferAttribute(colorsFor("twig", mode, meta), 3));
    g.setIndex(new THREE.BufferAttribute(arr.twig_idx, 1));
    objects.twigs = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ vertexColors: true }));
    scene.add(objects.twigs);
  }
  if (arr.skel_pos.length && $("showSkel").checked) {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(arr.skel_pos, 3));
    g.setIndex(new THREE.BufferAttribute(arr.skel_idx, 1));
    objects.skel = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x78d0ff, transparent: true, opacity: 0.85 }));
    scene.add(objects.skel);
  }
  if (arr.shed_pos && arr.shed_pos.length && $("showShed").checked) {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(arr.shed_pos, 3));
    objects.shed = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0xd2563a, transparent: true, opacity: 0.25 }));
    scene.add(objects.shed);
  }
  if (arr.attr_pos && $("showAttr").checked) {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(arr.attr_pos, 3));
    const st = arr.attr_state, col = new Float32Array(st.length * 3);
    const PAL = [[0.35,0.35,0.38],[0.45,0.85,0.45],[0.35,0.55,0.95],[0.85,0.3,0.25]]; // waiting/active/consumed/dormant
    for (let i = 0; i < st.length; i++) { const c = PAL[st[i]] || PAL[0];
      col[i*3] = c[0]; col[i*3+1] = c[1]; col[i*3+2] = c[2]; }
    g.setAttribute("color", new THREE.BufferAttribute(col, 3));
    objects.attr = new THREE.Points(g, new THREE.PointsMaterial({ size: 0.09, vertexColors: true,
                                    transparent: true, opacity: 0.55 }));
    scene.add(objects.attr);
  }
  if (arr.env_profile && $("showEnv").checked) {
    const prof = arr.env_profile, rings = 9, seg = 48, pts = [];
    const n = prof.length / 2;
    const sample = (i) => ({ y: prof[i*2], r: prof[i*2+1] });
    for (let k = 0; k < rings; k++) {                   // horizontal rings
      const i = Math.round(k * (n - 1) / (rings - 1)), { y, r } = sample(i);
      for (let j = 0; j < seg; j++) {
        const a = 2*Math.PI*j/seg, b = 2*Math.PI*(j+1)/seg;
        pts.push(Math.cos(a)*r, y, Math.sin(a)*r, Math.cos(b)*r, y, Math.sin(b)*r);
      }
    }
    for (let j = 0; j < 8; j++) {                        // vertical profile lines
      const a = 2*Math.PI*j/8;
      for (let i = 0; i < n - 1; i++) {
        const p0 = sample(i), p1 = sample(i+1);
        pts.push(Math.cos(a)*p0.r, p0.y, Math.sin(a)*p0.r, Math.cos(a)*p1.r, p1.y, Math.sin(a)*p1.r);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(pts), 3));
    objects.env = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x4f7fa8,
                                         transparent: true, opacity: 0.3 }));
    scene.add(objects.env);
  }
  grid.visible = $("showGrid").checked;

  $("hud").textContent =
    `${meta.scene}  seed ${meta.seed}  age ${meta.age}  ${meta.fast ? "[fast scrub]" : "[exact]"}\n` +
    `${meta.curves} branches   height ${meta.height.toFixed(1)} m   DBH ${meta.dbh.toFixed(2)} m\n` +
    `${(meta.geo_stats.trunk_faces + meta.geo_stats.branch_faces).toLocaleString()} faces   ` +
    `${meta.geo_stats.twig_curves.toLocaleString()} twig curves   ${meta.elapsed.toFixed(2)} s`;
}

// ---------------------------------------------------------------- generate
async function generate(fast) {
  if (inflight) inflight.abort();
  const ctrl = new AbortController(); inflight = ctrl;
  busy(+1);
  try {
    const r = await fetch("/api/generate", {
      method: "POST", signal: ctrl.signal,
      body: JSON.stringify({ params, seed: +$("seedN").value, age: +$("ageN").value,
                             scene: $("scene").value || null, lod: +$("lodN").value, fast,
                             debug: $("showAttr").checked || $("showEnv").checked })
    });
    if (r.status === 409) return;                    // a newer request replaced this one
    if (!r.ok) { msg((await r.json()).error, true); return; }
    data = unpack(await r.arrayBuffer());
    msg("");
    rebuild();
  } catch (e) {
    if (e.name !== "AbortError") msg(String(e), true);
  } finally {
    if (inflight === ctrl) inflight = null;
    busy(-1);
  }
}

// ---------------------------------------------------------------- parameter panel
function paramRow(group, p) {
  const tier = tiers[group] || 3;
  const row = document.createElement("div"); row.className = "row";
  const dot = document.createElement("span"); dot.className = "dot t" + tier;
  dot.title = tier === 1 ? "geometry only — updates live"
            : tier === 2 ? "skeleton + geometry — updates live"
            : "needs a full simulation";
  row.appendChild(dot);
  const lab = document.createElement("label"); lab.textContent = p.name;
  lab.title = (p.doc || "") + (p.unit ? ` [${p.unit}]` : "");
  row.appendChild(lab);
  const set = (v) => { params[group][p.name] = v; scheduleParamRegen(tier); };

  if (p.kind === "float" || p.kind === "int") {
    const lo = p.lo ?? 0, hi = p.hi ?? (params[group][p.name] * 4 || 1);
    const r = document.createElement("input"); r.type = "range";
    r.min = lo; r.max = hi; r.step = p.kind === "int" ? 1 : (hi - lo) / 200;
    const n = document.createElement("input"); n.type = "number"; n.step = r.step;
    r.value = n.value = params[group][p.name];
    r.oninput = () => {
      n.value = r.value;
      params[group][p.name] = p.kind === "int" ? +r.value | 0 : +r.value;
      if (tier < 3) scheduleParamRegen(tier);            // live while dragging
    };
    r.onchange = () => { n.value = r.value; set(p.kind === "int" ? +r.value | 0 : +r.value); };
    n.onchange = () => { r.value = n.value; set(p.kind === "int" ? +n.value | 0 : +n.value); };
    row.append(r, n);
  } else if (p.kind === "dict") {
    row.removeChild(lab);
    const wrap = document.createElement("div"); wrap.className = "grow";
    const head = document.createElement("div"); head.className = "msg"; head.textContent = p.name; wrap.appendChild(head);
    for (const k of Object.keys(params[group][p.name])) {
      const sub = document.createElement("div"); sub.className = "row";
      const sl = document.createElement("label"); sl.textContent = "  " + k; sub.appendChild(sl);
      const n = document.createElement("input"); n.type = "number"; n.step = 0.01;
      n.value = params[group][p.name][k];
      n.onchange = () => { params[group][p.name][k] = +n.value; scheduleParamRegen(tier); };
      sub.appendChild(n); wrap.appendChild(sub);
    }
    row.appendChild(wrap);
  } else {
    const t = document.createElement("input"); t.type = "text"; t.className = "wide";
    t.value = typeof params[group][p.name] === "string" ? params[group][p.name]
                                                        : JSON.stringify(params[group][p.name]);
    t.onchange = () => {
      try { set(p.kind === "str" ? t.value : JSON.parse(t.value)); t.style.borderColor = ""; }
      catch (e) { t.style.borderColor = "#e0714f"; }
    };
    row.appendChild(t);
  }
  return row;
}

function buildPanel() {
  const host = $("params"); host.innerHTML = "";
  for (const [group, plist] of Object.entries(schema)) {
    const fs = document.createElement("fieldset");
    const tier = tiers[group] || 3;
    const lg = document.createElement("legend");
    const key = document.createElement("span"); key.className = "dot t" + tier;
    lg.title = tier < 3 ? "updates live while dragging" : "needs a full simulation";
    lg.append(key, group);
    const body = document.createElement("div"); body.className = "body";
    lg.onclick = () => fs.classList.toggle("collapsed");
    if (["age_response", "materials", "geometry"].includes(group)) fs.classList.add("collapsed");
    plist.forEach((p) => body.appendChild(paramRow(group, p)));
    fs.append(lg, body); host.appendChild(fs);
  }
}

let paramTimer = null;
function scheduleParamRegen(tier = 3) {
  clearTimeout(paramTimer);
  paramTimer = setTimeout(() => generate(false), tier < 3 ? 40 : 350);
}

// ---------------------------------------------------------------- wiring
function pair(rangeId, numId, onChange) {
  const r = $(rangeId), n = $(numId);
  r.oninput = () => { n.value = r.value; onChange(false); };
  r.onchange = () => { n.value = r.value; onChange(true); };
  n.onchange = () => { r.value = n.value; onChange(true); };
}

async function loadSpecies(name) {
  const r = await fetch("/api/species/" + name);
  params = await r.json();
  $("species").value = name;
  $("ageR").max = Math.round(params.meta.max_age);
  $("ageN").value = $("ageR").value = Math.round(params.meta.reference_age);
  buildPanel();
  generate(false);
}

// ---------------------------------------------------------------- variant grid
let variantPoll = null;
function closeVariants() {
  clearInterval(variantPoll); variantPoll = null;
  $("variantsOverlay").hidden = true;
}
async function showVariants() {
  closeVariants();
  const seeds = [1, 2, 3, 4, 5, 6, 7, 8, 9], age = +$("ageN").value;
  const sceneName = $("scene").value || "open field";
  const r = await fetch("/api/variants", { method: "POST", body: JSON.stringify(
    { params, age, scene: $("scene").value || null, seeds }) });
  const job = await r.json();
  if (!r.ok) { msg(job.error, true); return; }
  const title = (n) => `${params.meta.name} · ${sceneName} · age ${age} — ${n} / ${seeds.length} ready · ` +
                       "click a tree to use its seed (all drawn at the same scale)";
  $("vtitle").textContent = title(0);
  $("variants").innerHTML = seeds.map((s) =>
    `<div class="cell pending" id="vcell${s}"><div class="cap">seed ${s} · growing…</div></div>`).join("");
  $("variantsOverlay").hidden = false;
  const shown = new Set();
  const poll = variantPoll = setInterval(async () => {
    let st;
    try {
      const res = await fetch("/api/variants/" + job.id);
      st = await res.json();
      if (!res.ok) throw new Error(st.error);
    } catch (e) {
      if (variantPoll !== poll) return;
      clearInterval(variantPoll); variantPoll = null;
      $("vtitle").textContent = "variants failed: " + e.message;
      return;
    }
    if (variantPoll !== poll) return;               // closed or replaced while this poll was in flight
    for (const s of st.ready) {
      if (shown.has(s)) continue;
      shown.add(s);
      const cell = $("vcell" + s);
      cell.className = "cell ready" + (s === +$("seedN").value ? " current" : "");
      cell.innerHTML = `<img src="/api/variants/${job.id}/${s}" alt="seed ${s}"><div class="cap">seed ${s}</div>`;
      cell.onclick = () => {
        $("seedN").value = $("seedR").value = s;
        closeVariants();
        generate(false);
      };
    }
    $("vtitle").textContent = title(st.ready.length) + (st.errors.length ? " · error: " + st.errors[0] : "");
    if (st.done) { clearInterval(variantPoll); variantPoll = null; }
  }, 700);
}

(async function init() {
  const boot = await (await fetch("/api/bootstrap")).json();
  schema = boot.schema; tiers = boot.tiers || {};
  $("version").textContent = boot.version;
  for (const s of boot.species) $("species").add(new Option(s, s));
  $("scene").add(new Option("open field (none)", ""));
  for (const s of boot.scenes) $("scene").add(new Option(s, s));
  $("species").onchange = () => loadSpecies($("species").value);
  $("scene").onchange = () => generate(false);

  pair("seedR", "seedN", (released) => { if (released) generate(false); });
  pair("ageR", "ageN", (released) => generate(released ? !$("exact").checked : true));
  pair("lodR", "lodN", (released) => { if (released) generate(false); });
  for (const id of ["mode", "showMesh", "showTwig", "showSkel", "showShed", "showGrid"]) $(id).onchange = rebuild;
  for (const id of ["showAttr", "showEnv"]) $(id).onchange = () => generate(false);   // needs debug arrays
  $("regen").onclick = () => generate(false);

  $("export").onclick = async () => {
    msg("writing USD…");
    const r = await fetch("/api/export", { method: "POST", body: JSON.stringify(
      { params, seed: +$("seedN").value, age: +$("ageN").value, scene: $("scene").value || null, lod: +$("lodN").value }) });
    const j = await r.json();
    msg(r.ok ? "wrote " + j.files[0] : j.error, !r.ok);
  };
  $("save").onclick = async () => {
    const path = prompt("save species TOML as:", "species/" + params.meta.name + ".toml");
    if (!path) return;
    const r = await fetch("/api/save", { method: "POST", body: JSON.stringify({ params, path }) });
    const j = await r.json();
    msg(r.ok ? "saved " + j.path : j.error, !r.ok);
  };
  $("variantsBtn").onclick = showVariants;
  $("vclose").onclick = closeVariants;
  addEventListener("keydown", (e) => { if (e.key === "Escape") closeVariants(); });

  await loadSpecies(boot.species.includes("quercus.toml") ? "quercus.toml" : boot.species[0]);
})();
</script>
</body>
