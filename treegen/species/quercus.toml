# Pedunculate oak. Base values describe the tree at reference_age.
[meta]
name = "quercus_robur"
reference_age = 80
max_age = 200

[envelope]
shape = "profile"
profile = [[0,0],[0.3,0.9],[0.7,1.0],[1,0.2]]
height = 22.0
spread_ratio = 1.15

[growth]
attractor_count = 20000
influence_radius = 10.0     # relative to step_length
kill_radius = 2.0           # relative to step_length
step_length = 0.35
apical_dominance = 0.75
straightness = 0.3
iterations_per_year = 2

[architecture]
branch_angle = { mean = 48, var = 12 }
max_order = 4
min_radius_for_mesh = 0.04

[radii]
pipe_exponent = 2.3
tip_radius = 0.01
trunk_flare = { amount = 0.4, height = 0.08 }
junction_swell = 1.15

[refinement]
smoothing = 0.6
gravity_droop = 0.45
phototropism = 0.2
noise = { amplitude = 0.08, frequency = 2.0 }

[light]
shed_threshold = 0.15
grid_resolution = 64
foliage_density = 2.0

[geometry]
mesh_orders = [0, 1]
radial_segments = { min = 6, max = 24 }

[materials]
order_ranges = [[0,1,"bark_mature"], [2,4,"bark_young"]]

[age_response]
height = [[0,0.1],[0.3,0.7],[1,1.0]]
trunk_radius = [[0,0.05],[1,1.0]]
crown_flatten = [[0,0.0],[1,0.6]]
apical_dominance = [[0,1.0],[1,0.3]]
shed_threshold = [[0,0.05],[1,0.3]]
reiteration = [[0,0.0],[0.8,0.4]]
