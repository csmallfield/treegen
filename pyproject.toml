[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "treegen"
version = "0.1.0"
description = "Headless, USD-native procedural tree generator (space colonization + light competition)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "usd-core>=24.8",
]

[project.optional-dependencies]
preview = ["matplotlib>=3.8"]
dev = ["pytest>=8", "matplotlib>=3.8"]

[project.scripts]
treegen = "treegen.cli.main:main"

[tool.setuptools.packages.find]
include = ["treegen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
