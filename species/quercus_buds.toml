# Pedunculate oak grown with the bud-based model (docs/BUD_BACKEND_DESIGN.md).
# Experimental: being calibrated against open-grown oak targets (scripts/bud_eval.py).
# The bud model reads the buds, light (rays and sky only), radii, refinement,
# geometry and materials groups and the age curves below. It has no envelope.
[meta]
name = "quercus_robur_buds"
reference_age = 80
max_age = 200

[growth]
model = "buds"

[buds]
# calibrated by scripts/bud_calibrate.py over 20, 80 and 200 years, weighted toward the
# open-grown spread at 80 years (calib8 rank 0; docs/BUD_BACKEND_DESIGN.md section 19)
light_model = "shadow"      # the paper's shadow propagation
shadow_a = 0.0429
shadow_b = 1.9281
shadow_depth = 10
shadow_cell = 0.3472
shoot_length = 0.1          # m of internode per unit of resource
resource_per_light = 3.0465
apical_control = 0.54
apical_control_old = 0.4711
shed_threshold = 0.2761
max_height = 45.0           # m; hydraulic limit by height
max_path = 71.546           # m; hydraulic limit by path length from the root
respiration = 0.0148        # maintenance upkeep per metre of sapwood path
wood_set = 0.1519           # growth-time droop
reaction_wood = 0.521       # limbs pull back toward the way they grew
lateral_buds = 0            # acrotony off
branching_angle = 39.9098
phyllotaxis = 137.5
light_weight = 0.1019
tropism = -0.0471           # eta, positive = up
[architecture]
max_order = 4
min_radius_for_mesh = 0.04

[radii]
pipe_exponent = 2.8         # fitted with tip_radius to open-grown DBH at 20, 80 and 200 y
tip_radius = 0.0045         # m; a 9 mm current-year shoot
trunk_flare = { amount = 0.4, height = 0.08 }
junction_swell = 1.15

[refinement]
smoothing = 0.6
gravity_droop = 0.0         # droop happens during growth (buds.wood_set)
phototropism = 0.2
noise = { amplitude = 0.08, frequency = 2.0 }

[geometry]
mesh_orders = [0, 1, 2, 3, 4]
radial_segments = { min = 6, max = 24 }
cluster_twigs = 0

[materials]
order_ranges = [[0,1,"bark_mature"], [2,4,"bark_young"]]

[age_response]
height = [[0,0.1],[0.3,0.7],[1,1.0]]
trunk_radius = [[0,1.0],[1,1.0]]   # flat: annual rings already thicken the trunk with age
